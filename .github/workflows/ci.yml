name: Client Chat source and Worker verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-chat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, security, Super EVA, types, and Worker bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the declared Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Verify exact runtime authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Verify release and workflow contract
        run: node scripts/check-release-contract.mjs

      - name: Install the frozen Worker dependency graph
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Run the complete repository-native validation chain
        run: npm --prefix worker run check

      - name: Prove validation did not mutate the checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
