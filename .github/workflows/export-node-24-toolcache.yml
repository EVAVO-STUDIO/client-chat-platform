name: Export exact Audio Studio tool caches

on:
  push:
    branches:
      - agent/node-24-toolcache-export-20260803
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-node-24-toolcache.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Use exact Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Use Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify and archive exact tool caches
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          python --version | grep '^Python 3\.11\.'

          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          PYTHON_ROOT="$(dirname "$(dirname "$(command -v python)")")"
          test -x "$NODE_ROOT/bin/node"
          test -x "$NODE_ROOT/bin/npm"
          test -x "$PYTHON_ROOT/bin/python"

          mkdir -p node-export python-export
          tar \
            --sort=name \
            --mtime='UTC 2000-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf node-export/node-24.18.0-linux-x64.tar.gz \
            -C "$NODE_ROOT" .
          tar \
            --sort=name \
            --mtime='UTC 2000-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf python-export/python-3.11-linux-x64.tar.gz \
            -C "$PYTHON_ROOT" .

          sha256sum node-export/node-24.18.0-linux-x64.tar.gz > node-export/SHA256SUMS.txt
          sha256sum python-export/python-3.11-linux-x64.tar.gz > python-export/SHA256SUMS.txt
          printf 'node=%s\nnpm=%s\nsource=%s\n' \
            "$(node --version)" \
            "$(npm --version)" \
            "$NODE_ROOT" > node-export/IDENTITY.txt
          printf 'python=%s\nsource=%s\n' \
            "$(python --version 2>&1)" \
            "$PYTHON_ROOT" > python-export/IDENTITY.txt

      - name: Upload exact Node tool cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-24.18.0-linux-x64-toolcache
          path: node-export
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact Python tool cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-3.11-linux-x64-toolcache
          path: python-export
          if-no-files-found: error
          retention-days: 1
