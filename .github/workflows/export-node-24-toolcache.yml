name: Export exact Node 24 tool cache

on:
  push:
    branches:
      - agent/node-24-toolcache-export-20260803
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-node-24-toolcache.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use exact Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify and archive exact tool cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          test -x "$NODE_ROOT/bin/node"
          test -x "$NODE_ROOT/bin/npm"
          mkdir -p toolcache-export
          tar \
            --sort=name \
            --mtime='UTC 2000-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf toolcache-export/node-24.18.0-linux-x64.tar.gz \
            -C "$NODE_ROOT" .
          sha256sum toolcache-export/node-24.18.0-linux-x64.tar.gz > toolcache-export/SHA256SUMS.txt
          printf 'node=%s\nnpm=%s\nsource=%s\n' \
            "$(node --version)" \
            "$(npm --version)" \
            "$NODE_ROOT" > toolcache-export/IDENTITY.txt

      - name: Upload exact tool cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-24.18.0-linux-x64-toolcache
          path: toolcache-export
          if-no-files-found: error
          retention-days: 1
