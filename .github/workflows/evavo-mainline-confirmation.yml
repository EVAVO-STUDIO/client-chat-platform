name: EVAVO mainline confirmation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Confirm client chat source and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: evavo-mainline-${{ inputs.expected_sha }}-client-chat
      cancel-in-progress: false

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install frozen Worker dependency graph
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Run complete source, security, type and bundle chain
        run: npm --prefix worker run check

      - name: Retain Wrangler dry-run bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-chat-worker-bundle-${{ inputs.expected_sha }}
          path: worker/.wrangler/dry-run/
          if-no-files-found: ignore
          retention-days: 14
