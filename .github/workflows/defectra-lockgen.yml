name: Temporary Defectra lock generation

on:
  push:
    branches:
      - automation/defectra-lockgen
    paths:
      - ".github/workflows/defectra-lockgen.yml"

permissions:
  contents: write

concurrency:
  group: defectra-lockgen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lock:
    name: Generate verified pnpm workspace lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated automation ref
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          test "$(pnpm --version)" = "10.20.0"

      - name: Prepare isolated package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lockgen/api
          cat > lockgen/package.json <<'JSON'
          {
            "name": "Defectra",
            "version": "1.0.0",
            "private": true,
            "license": "UNLICENSED",
            "packageManager": "pnpm@10.20.0",
            "engines": { "node": "22.x" },
            "dependencies": {
              "@aws-sdk/client-s3": "^3.998.0",
              "@aws-sdk/s3-request-presigner": "^3.998.0",
              "@babel/runtime": "^7.26.0",
              "@expo-google-fonts/inter": "^0.4.2",
              "@expo/metro-runtime": "~4.0.1",
              "@expo/vector-icons": "^14.0.0",
              "@react-native-async-storage/async-storage": "1.23.1",
              "@react-native-community/datetimepicker": "8.2.0",
              "@react-native-community/netinfo": "11.4.1",
              "@react-native-picker/picker": "2.9.0",
              "@react-navigation/native": "^7.1.19",
              "@react-navigation/native-stack": "^7.6.2",
              "expo": "~52.0.47",
              "expo-asset": "^11.0.5",
              "expo-auth-session": "6.0.3",
              "expo-clipboard": "8.0.7",
              "expo-constants": "~17.0.8",
              "expo-dev-client": "~5.0.17",
              "expo-document-picker": "13.0.3",
              "expo-file-system": "17.0.1",
              "expo-image": "2.0.7",
              "expo-image-picker": "16.0.6",
              "expo-linking": "7.0.5",
              "expo-location": "17.0.1",
              "expo-notifications": "0.29.14",
              "expo-router": "4.0.21",
              "expo-sharing": "13.0.1",
              "expo-speech": "13.0.1",
              "expo-speech-recognition": "^2.1.5",
              "expo-splash-screen": "0.29.24",
              "expo-web-browser": "14.0.2",
              "file-saver": "^2.0.5",
              "firebase": "12.5.0",
              "lottie-ios": "^4.5.1",
              "lottie-react-native": "7.1.0",
              "pdf-lib": "^1.17.1",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "react-error-boundary": "4.0.11",
              "react-native": "0.76.9",
              "react-native-gesture-handler": "2.20.2",
              "react-native-maps": "1.18.0",
              "react-native-modal-datetime-picker": "^18.0.0",
              "react-native-safe-area-context": "4.12.0",
              "react-native-screens": "4.4.0",
              "react-native-toast-message": "^2.3.3",
              "react-native-web": "0.19.13",
              "react-native-webview": "13.12.5",
              "react-sketch-canvas": "^6.2.0",
              "zod": "^4.1.12"
            },
            "devDependencies": {
              "@babel/plugin-transform-runtime": "^7.26.0",
              "@types/file-saver": "^2.0.7",
              "@types/node": "20.14.11",
              "@types/react": "18.3.26",
              "@types/react-dom": "18.3.1",
              "@typescript-eslint/eslint-plugin": "7.18.0",
              "@typescript-eslint/parser": "7.18.0",
              "babel-plugin-module-resolver": "^5.0.2",
              "cross-env": "^7.0.3",
              "eslint": "8.57.1",
              "eslint-plugin-react": "7.35.0",
              "eslint-plugin-react-hooks": "4.6.2",
              "prettier": "3.3.3",
              "typescript": "5.9.3"
            },
            "pnpm": {
              "onlyBuiltDependencies": ["@firebase/util", "esbuild", "protobufjs"]
            }
          }
          JSON
          cat > lockgen/api/package.json <<'JSON'
          {
            "name": "api",
            "version": "1.2.0",
            "private": true,
            "type": "module",
            "dependencies": {
              "@aws-sdk/client-s3": "^3.998.0",
              "@aws-sdk/s3-request-presigner": "^3.998.0",
              "@google-cloud/vision": "^5.1.0",
              "@qdrant/js-client-rest": "^1.14.0",
              "dotenv": "^16.5.0",
              "firebase-admin": "^13.4.0",
              "openai": "^4.100.0",
              "resend": "^3.2.0",
              "zod": "^3.23.8"
            },
            "devDependencies": {
              "@types/node": "^20.17.50",
              "@vercel/node": "^3.2.20",
              "tsx": "^4.20.6",
              "typescript": "5.9.3"
            },
            "engines": { "node": "22.x" }
          }
          JSON
          cat > lockgen/pnpm-workspace.yaml <<'YAML'
          packages:
            - "."
            - "api"
          YAML
          cat > lockgen/.npmrc <<'RC'
          frozen-lockfile=true
          shared-workspace-lockfile=true
          link-workspace-packages=true
          RC

      - name: Generate and freeze the shared workspace lock
        shell: bash
        working-directory: lockgen
        env:
          SOURCE_COMMIT: c2337ea427276783eea43257dc748e0ef58f50b4
          ROOT_PACKAGE_BLOB: 70a0333b6f620533c88519c8486fa575a99ac9a9
          API_PACKAGE_BLOB: 184df1ba9979e9438853b1489d1fe4a6c175d7b6
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml receipt.json
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          grep --quiet '^  \.:$' pnpm-lock.yaml
          grep --quiet '^  api:$' pnpm-lock.yaml
          export NODE_VERSION="$(node --version)"
          export PNPM_VERSION="$(pnpm --version)"
          export LOCK_SHA256="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            schemaVersion: '1.0',
            purpose: 'Defectra complete shared pnpm workspace lock generation',
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRootPackageBlob: process.env.ROOT_PACKAGE_BLOB,
            sourceApiPackageBlob: process.env.API_PACKAGE_BLOB,
            node: process.env.NODE_VERSION,
            pnpm: process.env.PNPM_VERSION,
            lockSha256: process.env.LOCK_SHA256,
            rootImporterPresent: true,
            apiImporterPresent: true,
            frozenLockfileVerification: true,
            sourceCodeCopied: false,
            credentialsCopied: false,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowSha: process.env.GITHUB_SHA,
            artifactName: `defectra-pnpm-lock-${process.env.GITHUB_SHA}`
          };
          fs.writeFileSync('receipt.json', `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          NODE

      - name: Publish generated lock to the isolated ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lockgen/pnpm-lock.yaml lockgen/receipt.json
          git diff --cached --check
          git commit -m "chore(lockgen): publish Defectra pnpm lock [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload short-lived lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: defectra-pnpm-lock-${{ github.sha }}
          path: |
            lockgen/pnpm-lock.yaml
            lockgen/receipt.json
          if-no-files-found: error
          retention-days: 1
