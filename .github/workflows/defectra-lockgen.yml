name: Temporary Defectra lock generation

on:
  push:
    branches:
      - automation/defectra-lockgen
    paths:
      - ".github/workflows/defectra-lockgen.yml"
      - "lockgen/package.json"
      - "lockgen/api/package.json"
      - "lockgen/pnpm-workspace.yaml"
      - "lockgen/.npmrc"

permissions:
  contents: write

concurrency:
  group: defectra-lockgen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lock:
    name: Generate and install verified pnpm workspace lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated automation ref
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          test "$(pnpm --version)" = "10.20.0"

      - name: Generate, freeze and install the shared workspace graph
        shell: bash
        working-directory: lockgen
        env:
          SOURCE_COMMIT: c2337ea427276783eea43257dc748e0ef58f50b4
        run: |
          set -euo pipefail
          rm -rf node_modules api/node_modules
          rm -f pnpm-lock.yaml receipt.json
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          grep --quiet '^  \.:$' pnpm-lock.yaml
          grep --quiet '^  api:$' pnpm-lock.yaml
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(
              Object.keys(value).sort().map((key) => [key, stable(value[key])])
            );
          };
          const projection = (pkg) => ({
            packageManager: pkg.packageManager ?? null,
            engines: pkg.engines ?? {},
            dependencies: pkg.dependencies ?? {},
            devDependencies: pkg.devDependencies ?? {},
            optionalDependencies: pkg.optionalDependencies ?? {},
            peerDependencies: pkg.peerDependencies ?? {},
            peerDependenciesMeta: pkg.peerDependenciesMeta ?? {},
            pnpm: pkg.pnpm ?? {},
            overrides: pkg.overrides ?? {},
            resolutions: pkg.resolutions ?? {}
          });
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const api = JSON.parse(fs.readFileSync('api/package.json', 'utf8'));
          const dependencyFingerprint = hash(
            JSON.stringify(stable({ root: projection(root), api: projection(api) }))
          );
          const lockBytes = fs.readFileSync('pnpm-lock.yaml');
          const receipt = {
            schemaVersion: '1.1',
            purpose: 'Defectra complete shared pnpm workspace lock generation',
            sourceCommit: process.env.SOURCE_COMMIT,
            dependencyFingerprintSha256: dependencyFingerprint,
            workspaceConfigSha256: hash(fs.readFileSync('pnpm-workspace.yaml')),
            npmrcSha256: hash(fs.readFileSync('.npmrc')),
            node: process.version,
            pnpm: '10.20.0',
            lockSha256: hash(lockBytes),
            rootImporterPresent: true,
            apiImporterPresent: true,
            frozenLockfileVerification: true,
            frozenInstallVerification: true,
            scriptsExecuted: false,
            sourceCodeCopied: false,
            credentialsCopied: false,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowSha: process.env.GITHUB_SHA,
            artifactName: `defectra-pnpm-lock-${process.env.GITHUB_SHA}`
          };
          fs.writeFileSync('receipt.json', `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          NODE

      - name: Publish generated lock to the isolated ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lockgen/pnpm-lock.yaml lockgen/receipt.json
          git diff --cached --check
          git commit -m "chore(lockgen): publish installed Defectra pnpm lock [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload short-lived lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: defectra-pnpm-lock-${{ github.sha }}
          path: |
            lockgen/pnpm-lock.yaml
            lockgen/receipt.json
          if-no-files-found: error
          retention-days: 1
