name: Generate Defectra SDK 52 lock candidate once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-defectra-sdk52-lock-candidate-once.yml

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Regenerate and verify the current Defectra workspace lock
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Activate exact pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(pnpm --version)" = "10.20.0"

      - name: Create the bounded Defectra dependency workspace
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/defectra-sdk52-lock"
          rm -rf "${workdir}"
          mkdir -p "${workdir}/api"

          cat > "${workdir}/package.json" <<'JSON'
          {
            "name": "Defectra",
            "version": "1.0.0",
            "private": true,
            "license": "UNLICENSED",
            "packageManager": "pnpm@10.20.0",
            "engines": { "node": "22.x" },
            "dependencies": {
              "@aws-sdk/client-s3": "^3.998.0",
              "@aws-sdk/s3-request-presigner": "^3.998.0",
              "@babel/runtime": "^7.26.0",
              "@expo-google-fonts/inter": "^0.4.2",
              "@expo/metro-runtime": "~4.0.1",
              "@expo/vector-icons": "~14.0.4",
              "@react-native-async-storage/async-storage": "1.23.1",
              "@react-native-community/datetimepicker": "8.2.0",
              "@react-native-community/netinfo": "11.4.1",
              "@react-native-picker/picker": "2.9.0",
              "@react-navigation/native": "^7.0.14",
              "@react-navigation/native-stack": "^7.2.0",
              "expo": "~52.0.47",
              "expo-font": "~13.0.4",
              "expo-asset": "~11.0.5",
              "expo-auth-session": "6.0.3",
              "expo-clipboard": "~7.0.1",
              "expo-constants": "~17.0.8",
              "expo-dev-client": "~5.0.17",
              "expo-document-picker": "13.0.3",
              "expo-file-system": "~18.0.12",
              "expo-image": "2.0.7",
              "expo-image-picker": "16.0.6",
              "expo-linking": "7.0.5",
              "expo-location": "~18.0.10",
              "expo-notifications": "0.29.14",
              "expo-router": "~4.0.22",
              "expo-sharing": "13.0.1",
              "expo-speech": "13.0.1",
              "expo-speech-recognition": "^2.1.5",
              "expo-splash-screen": "0.29.24",
              "expo-web-browser": "14.0.2",
              "file-saver": "^2.0.5",
              "firebase": "12.5.0",
              "lottie-ios": "^4.5.1",
              "lottie-react-native": "7.1.0",
              "pdf-lib": "^1.17.1",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "react-error-boundary": "4.0.11",
              "react-native": "0.76.9",
              "react-native-gesture-handler": "2.20.2",
              "react-native-maps": "1.18.0",
              "react-native-modal-datetime-picker": "^18.0.0",
              "react-native-safe-area-context": "4.12.0",
              "react-native-screens": "4.4.0",
              "react-native-toast-message": "^2.3.3",
              "react-native-web": "0.19.13",
              "react-native-webview": "13.12.5",
              "react-sketch-canvas": "^6.2.0",
              "zod": "^4.1.12"
            },
            "devDependencies": {
              "@babel/plugin-transform-runtime": "^7.26.0",
              "@types/file-saver": "^2.0.7",
              "@types/node": "20.14.11",
              "@types/react": "18.3.26",
              "@types/react-dom": "18.3.1",
              "@typescript-eslint/eslint-plugin": "7.18.0",
              "@typescript-eslint/parser": "7.18.0",
              "babel-plugin-module-resolver": "^5.0.2",
              "cross-env": "^7.0.3",
              "eslint": "8.57.1",
              "eslint-plugin-react": "7.35.0",
              "eslint-plugin-react-hooks": "4.6.2",
              "prettier": "3.3.3",
              "typescript": "5.9.3"
            },
            "pnpm": {
              "onlyBuiltDependencies": ["@firebase/util", "esbuild", "protobufjs"]
            }
          }
          JSON

          cat > "${workdir}/api/package.json" <<'JSON'
          {
            "name": "api",
            "version": "1.2.0",
            "private": true,
            "type": "module",
            "description": "Serverless API for Defectra (mail, AI, cron, etc.)",
            "dependencies": {
              "@aws-sdk/client-s3": "^3.998.0",
              "@aws-sdk/s3-request-presigner": "^3.998.0",
              "@google-cloud/vision": "^5.1.0",
              "@qdrant/js-client-rest": "^1.14.0",
              "dotenv": "^16.5.0",
              "firebase-admin": "^13.4.0",
              "openai": "^4.100.0",
              "resend": "^3.2.0",
              "zod": "^3.23.8"
            },
            "devDependencies": {
              "@types/node": "^20.17.50",
              "@vercel/node": "^3.2.20",
              "tsx": "^4.20.6",
              "typescript": "5.9.3"
            },
            "engines": { "node": "22.x" }
          }
          JSON

          cat > "${workdir}/pnpm-workspace.yaml" <<'YAML'
          packages:
            - "api"
          YAML

          cat > "${workdir}/.npmrc" <<'NPMRC'
          engine-strict=true
          auto-install-peers=true
          strict-peer-dependencies=false
          NPMRC

          cp generated/defectra-expo-font-lock/pnpm-lock.yaml "${workdir}/pnpm-lock.yaml"
          printf '%s\n' "${workdir}" > "${RUNNER_TEMP}/defectra-lock-workdir.txt"

      - name: Regenerate and prove the frozen workspace graph
        run: |
          set -euo pipefail
          workdir="$(cat "${RUNNER_TEMP}/defectra-lock-workdir.txt")"
          cd "${workdir}"
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const source = fs.readFileSync("pnpm-lock.yaml", "utf8");
          const importer = source.match(/^importers:\s*\r?\n([\s\S]*?)(?=^packages:\s*$)/m)?.[1] || "";
          if (!/^  \.:\s*$/m.test(importer) || !/^  api:\s*$/m.test(importer)) {
            throw new Error("Candidate lock must contain both root and api importers.");
          }
          const expected = [
            ["'@expo/vector-icons'", "~14.0.4"],
            ["'@react-navigation/native'", "^7.0.14"],
            ["'@react-navigation/native-stack'", "^7.2.0"],
            ["expo-asset", "~11.0.5"],
            ["expo-clipboard", "~7.0.1"],
            ["expo-file-system", "~18.0.12"],
            ["expo-location", "~18.0.10"],
            ["expo-router", "~4.0.22"],
          ];
          for (const [name, specifier] of expected) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pattern = new RegExp(`^      ${escaped}:\\r?\\n        specifier: ${specifier.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}$`, "m");
            if (!pattern.test(importer)) {
              throw new Error(`Candidate root importer is missing ${name} ${specifier}.`);
            }
          }
          const bytes = fs.readFileSync("pnpm-lock.yaml");
          const receipt = {
            schemaVersion: "1.0",
            sourceRepository: "EVAVO-STUDIO/defectra",
            generatedFromPublicRecoveryLock: true,
            node: process.version,
            pnpm: "10.20.0",
            lockBytes: bytes.length,
            lockSha256: crypto.createHash("sha256").update(bytes).digest("hex"),
            rootImporterPresent: true,
            apiImporterPresent: true,
            frozenLockfileVerification: true,
            scriptsExecuted: false,
            sourceCodeCopied: false,
            credentialsCopied: false,
          };
          fs.writeFileSync("workspace-lock-receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log(JSON.stringify(receipt));
          NODE

          gzip -9 -c pnpm-lock.yaml > pnpm-lock.yaml.gz

      - name: Upload the bounded lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: defectra-sdk52-lock-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/defectra-sdk52-lock/pnpm-lock.yaml
            ${{ runner.temp }}/defectra-sdk52-lock/pnpm-lock.yaml.gz
            ${{ runner.temp }}/defectra-sdk52-lock/workspace-lock-receipt.json
          if-no-files-found: error
          retention-days: 3
