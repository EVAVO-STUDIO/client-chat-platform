name: Sentinel v5.0 Automated Analysis

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  sentinel-analysis:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sentinel Analysis
        run: node .sentinel/sentinel-orchestrator.js

      - name: TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run Tests
        run: npm test
        continue-on-error: true

      - name: Build Project
        run: npm run build
        continue-on-error: true

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: sentinel-reports
          path: .sentinel/reports/
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.sentinel/reports/analysis-report.json', 'utf8'));
            const summary = report.summary;

            const comment = `
## 🔍 Sentinel v5.0 Analysis Results
- **Repositories Analyzed:** ${summary.totalRepos}
- **Successful:** ${summary.successful}
- **Failed:** ${summary.failed}
- **Total Issues:** ${summary.totalIssues}
- **Security Vulnerabilities:** ${summary.totalVulnerabilities}

[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Create Issue for High Priority Items
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.sentinel/reports/analysis-report.json', 'utf8'));

            if (report.summary.totalVulnerabilities > 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[SECURITY] ${report.summary.totalVulnerabilities} vulnerabilities found`,
                body: `Sentinel v5.0 detected ${report.summary.totalVulnerabilities} security vulnerabilities. Please review and update dependencies.`,
                labels: ['security', 'sentinel']
              });
            }
