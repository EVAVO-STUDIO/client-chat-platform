name: Sentinel read-only repository diagnostics

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-chat-sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Verify Worker security, types, bundle, and source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use the declared Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Verify exact runtime authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Verify release and workflow contract
        run: node scripts/check-release-contract.mjs

      - name: Install the frozen Worker dependency graph
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Run repository-native Sentinel diagnostics
        run: npm --prefix worker run check

      - name: Prove diagnostics did not mutate the checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record bounded diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sentinel"
          printf '{"schemaVersion":"evavo.sentinel.repository-diagnostic.v1","repository":"%s","sha":"%s","node":"%s","npm":"%s","nativeValidation":"npm --prefix worker run check","sourceMutation":"forbidden","automaticCommit":false,"automaticPush":false}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(node --version 2>/dev/null || true)" "$(npm --version 2>/dev/null || true)" \
            > "$RUNNER_TEMP/sentinel/client-chat-diagnostic.json"

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-chat-sentinel-${{ github.run_id }}
          path: ${{ runner.temp }}/sentinel/client-chat-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
