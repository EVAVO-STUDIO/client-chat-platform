name: Export exact Audio Studio Python packages

on:
  push:
    branches:
      - agent/audio-python-env-export-20260803
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-audio-python-packages.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Use Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install and verify reviewed package set
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep '^Python 3\.11\.'
          mkdir -p python-packages package-export
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --target python-packages \
            numpy==2.2.6 \
            scipy==1.15.3 \
            soundfile==0.13.1 \
            librosa==0.11.0 \
            pyloudnorm==0.2.0
          PYTHONPATH="$PWD/python-packages" python - <<'PY'
          import importlib.metadata as metadata
          expected = {
              'numpy': '2.2.6',
              'scipy': '1.15.3',
              'soundfile': '0.13.1',
              'librosa': '0.11.0',
              'pyloudnorm': '0.2.0',
          }
          for name, version in expected.items():
              actual = metadata.version(name)
              if actual != version:
                  raise SystemExit(f'{name}: expected {version}, got {actual}')
              print(f'{name}=={actual}')
          import numpy, scipy, soundfile, librosa, pyloudnorm
          print('imports=passed')
          PY
          PYTHONPATH="$PWD/python-packages" python -m pip freeze --path python-packages | sort > package-export/FREEZE.txt
          tar \
            --sort=name \
            --mtime='UTC 2000-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf package-export/audio-python-3.11-packages.tar.gz \
            -C python-packages .
          sha256sum package-export/audio-python-3.11-packages.tar.gz > package-export/SHA256SUMS.txt
          printf 'python=%s\n' "$(python --version 2>&1)" > package-export/IDENTITY.txt

      - name: Upload exact Python package layer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-python-3.11-package-layer
          path: package-export
          if-no-files-found: error
          retention-days: 1
