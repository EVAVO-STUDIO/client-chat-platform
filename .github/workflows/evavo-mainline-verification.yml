name: EVAVO mainline verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character Client Chat main commit SHA
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: client-chat-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  verify-client-chat:
    name: Verify Client Chat contracts and Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"

      - name: Verify release contract
        run: node scripts/check-release-contract.mjs

      - name: Install committed dependency graph
        run: npm ci --no-audit --no-fund

      - name: Run complete source contract chain
        run: npm run check

      - name: Build Cloudflare Worker bundle without deployment
        run: npm run build

      - name: Record verification receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          mkdir -p artifacts/verification
          printf '{"schemaVersion":"1.0","repository":"EVAVO-STUDIO/client-chat-platform","sha":"%s","workflow":"evavo-mainline-verification.yml","node":"22.16.0","npm":"10.9.2","deployment":"disabled","providerCredentials":"not-required"}\n' "$EXPECTED_SHA" > artifacts/verification/receipt.json

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-chat-${{ inputs.expected_sha }}
          path: artifacts/verification/receipt.json
          if-no-files-found: error
          retention-days: 14
