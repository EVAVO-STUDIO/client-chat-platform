name: EVAVO mainline verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character Client Chat main commit SHA
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: client-chat-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  verify-client-chat:
    name: Verify Client Chat contracts and Worker bundle
    if: github.repository == 'EVAVO-STUDIO/client-chat-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$REQUEST_SOURCE" = "evavo-development-studio"

      - name: Check out exact mainline commit without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Verify exact runtime authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Verify release and workflow contract
        run: node scripts/check-release-contract.mjs

      - name: Install committed Worker dependency graph
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Run complete source, security, Super EVA, type, and bundle chain
        run: npm --prefix worker run check

      - name: Prove verification did not mutate the checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record bounded verification receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client-chat-verification"
          printf '{"schemaVersion":"1.0","repository":"EVAVO-STUDIO/client-chat-platform","sha":"%s","workflow":"evavo-mainline-verification.yml","node":"24.19.0","npm":"11.17.0","sourceMutation":"forbidden","deployment":"disabled","providerCredentials":"not-required"}\n' \
            "$EXPECTED_SHA" > "$RUNNER_TEMP/client-chat-verification/receipt.json"

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-chat-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/client-chat-verification/receipt.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
